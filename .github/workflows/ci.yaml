name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs to write.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa650b70adfbdd488 # v4.2.0
        with:
          version: 10.6.2
      - uses: actions/setup-node@6044e13b5dc448ebc241d29b171f66135d8767ac5 # v6.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cda9f07e4c7b99b27fb9b8376a77d401af05a2c # v5.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@f76416b6f0b31dcbe19b88d568aff30e0bf9441c # v3.2.4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
        working-directory: apps/android
      - run: ./gradlew assembleDebug testDebugUnitTest --warning-mode all
        working-directory: apps/android
