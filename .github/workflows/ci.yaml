name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: gitleaks lists PR commits via the API, so it needs pull-requests: read.
permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.2.0
        with:
          version: 10.6.2
      - uses: actions/setup-node@db0fb3a98ed314b69026b6e8c9be26a7e2fe65a8 # v6.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Proves apps/server/Dockerfile builds for both release platforms; nothing is pushed. Each platform
  # builds on a native runner (arm64 under QEMU took ~3 min of a ~5 min job). Only pushes to main
  # write the per-platform gha cache, so PRs skip the export and can't evict main's layers;
  # release.yaml reads both scopes.
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm # free native arm64 runner for public repos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=server-image-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,scope=server-image-{0},mode=max', matrix.arch) || '' }}

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@1aa87b638dacaa70f1c903fa9ec9cbd91058e2ff # v5.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      # Runner image already ships platforms;android-37 (compileSdk 37 built green before this line
      # existed); an explicit install of it fails on remote lookup. Only pin build-tools, with the
      # `android` CLI from cmdline-tools 22+ (sdkmanager prints a deprecation warning).
      - run: android sdk install "build-tools;36.0.0" --no-metrics
        working-directory: apps/android
      - run: ./gradlew lintDebug assembleDebug testDebugUnitTest --warning-mode all
        working-directory: apps/android
