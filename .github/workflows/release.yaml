# Builds the release APK and publishes it as a GitHub release when a version tag is pushed.
# The tag must equal "v" + versionName in apps/android/app/build.gradle.kts. A pre-release
# suffix (v0.2.0-beta.1) marks the release as a pre-release; a bare version (v0.2.0) is a
# full release. Signing needs repository secrets, see docs/device-setup.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload the APK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # versionCode is the commit count

      - name: Check the tag against versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' apps/android/app/build.gradle.kts)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName \"$version\" in apps/android/app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@1aa87b638dacaa70f1c903fa9ec9cbd91058e2ff # v5.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      # Same SDK step as ci.yaml: the image ships platforms;android-37, only build-tools is pinned.
      - run: sdkmanager "build-tools;36.0.0"
        working-directory: apps/android

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SHOWRUNNER_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::the SHOWRUNNER_KEYSTORE_BASE64 secret is not set (see docs/device-setup.md, release builds)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          SHOWRUNNER_KEYSTORE: ${{ runner.temp }}/release.jks
          SHOWRUNNER_KEY_ALIAS: ${{ secrets.SHOWRUNNER_KEY_ALIAS }}
          SHOWRUNNER_KEYSTORE_PASSWORD: ${{ secrets.SHOWRUNNER_KEYSTORE_PASSWORD }}
          # Optional: empty falls back to the keystore password (keytool's PKCS12 default).
          SHOWRUNNER_KEY_PASSWORD: ${{ secrets.SHOWRUNNER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --warning-mode all
        working-directory: apps/android

      - name: Name, checksum and verify the APK
        run: |
          apk="showrunner-$GITHUB_REF_NAME.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
          cert_sha256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$certs")
          { echo "## $apk"; echo; echo '```'; cat "$apk.sha256"; echo "$certs"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          notes="Sideload \`$APK\` on the display with adb set up as in [docs/device-setup.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/device-setup.md):

          \`\`\`sh
          scripts/install.sh --apk $APK --home --server http://<server-lan-ip>:3000 --secret \"\$DEVICE_SHARED_SECRET\"
          \`\`\`

          Signing certificate SHA-256: \`$CERT_SHA256\`"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes" "${flags[@]}"
