name: AI PR Review

# Deliberately `pull_request`, not `pull_request_target`: fork PRs then get no
# secrets and a read-only token, so untrusted code can never run next to
# AI_API_KEY. The fork guard below skips them cleanly instead of failing.
# (`pull_request_target` would instead run privileged against fork PRs, which
# is exactly the combination the opencode backend must never see.)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Same-repo, non-draft PRs only: fork PRs have no access to AI_API_KEY,
    # so running the job for them could only ever end in a red X.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Pass 1: correctness / security review from the diff.
          - pass: review
            ponytail: "off"
            backend: ${{ vars.AI_BACKEND || 'api' }}
            model: ${{ vars.AI_MODEL }}
            base_url: ${{ vars.AI_BASE_URL }}
          # Pass 2: Ponytail over-engineering review. Defaults to the same
          # endpoint/model but can be pointed at a cheaper or faster one, and
          # to the opencode backend so it can read the codebase.
          - pass: ponytail
            ponytail: "only"
            backend: ${{ vars.AI_PONYTAIL_BACKEND || vars.AI_BACKEND || 'api' }}
            model: ${{ vars.AI_PONYTAIL_MODEL || vars.AI_MODEL }}
            base_url: ${{ vars.AI_PONYTAIL_BASE_URL || vars.AI_BASE_URL }}

    # One in-flight run per PR per pass; a new push cancels the stale one.
    concurrency:
      group: ai-review-${{ matrix.pass }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    # Set AI_PASSES to "review" or "ponytail" to run only one of them.
    env:
      AI_BACKEND: ${{ matrix.backend }}
      RUN_THIS_PASS: ${{ !vars.AI_PASSES || contains(vars.AI_PASSES, matrix.pass) }}

    steps:
      # --- Checkout -------------------------------------------------------
      # Pinned to a full commit SHA so an upstream tag move cannot change the
      # code this workflow runs. persist-credentials: false keeps GITHUB_TOKEN
      # out of .git/config — the repo is PRIVATE, so any later git fetch must
      # be explicitly authenticated per-step (see "Fetch base branch" below);
      # anonymous fetches will fail with exit 128. This is deliberate: the
      # opencode backend reads the checked-out filesystem, and the token must
      # never be sitting in .git/config when it does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_THIS_PASS == 'true' && env.AI_BACKEND != 'opencode'
        with:
          # ai-review-instructions.md carries the project's settled review
          # decisions; the script appends it to the system prompt when present.
          sparse-checkout: |
            .github/scripts
            .github/ai-review-instructions.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_THIS_PASS == 'true' && env.AI_BACKEND == 'opencode'
        with:
          fetch-depth: 0
          persist-credentials: false

      # Authenticated per-command fetch: the token is scoped to this step's
      # env and passed as a header on this one git invocation, so it never
      # lands in .git/config or any file opencode can read in later steps.
      # (With fetch-depth: 0 the base ref usually already exists locally;
      # this keeps the diff base fresh if the branch moved after checkout.)
      # The base ref and the token both travel via env, never via workflow-
      # expression interpolation into the script or via argv: an untrusted
      # branch name cannot inject shell, and the Authorization header is
      # handed to git through GIT_CONFIG_* so it is not visible in `ps`.
      - name: Fetch base branch for diffing
        if: env.RUN_THIS_PASS == 'true' && env.AI_BACKEND == 'opencode'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
            git fetch --no-tags origin "$BASE_REF"

      # --- OpenCode install (opencode backend only) ------------------------
      # Pinned install: the installer is downloaded to a file (never piped
      # straight into bash), optionally verified against a checksum, and asked
      # for an exact opencode version. The self-hosted runner keeps its home
      # directory between jobs, so a matching install is reused as-is and the
      # network is only touched when the pin changes.
      #   OPENCODE_VERSION             — bump deliberately; reviews then run on
      #                                  exactly this release.
      #   vars.OPENCODE_INSTALL_SHA256 — optional sha256 of the installer script
      #                                  (`curl -fsSL https://opencode.ai/install | sha256sum`);
      #                                  when set, a changed installer fails the job.
      - name: Install OpenCode
        if: env.RUN_THIS_PASS == 'true' && env.AI_BACKEND == 'opencode'
        env:
          OPENCODE_VERSION: "1.18.27"
          OPENCODE_INSTALL_SHA256: ${{ vars.OPENCODE_INSTALL_SHA256 }}
        run: |
          set -euo pipefail
          BIN="$HOME/.opencode/bin/opencode"
          if [ -x "$BIN" ] && "$BIN" --version 2>/dev/null | grep -qx "$OPENCODE_VERSION"; then
            echo "opencode $OPENCODE_VERSION already installed"
          else
            INSTALLER="$(mktemp)"
            curl -fsSL --retry 3 -o "$INSTALLER" https://opencode.ai/install
            if [ -n "$OPENCODE_INSTALL_SHA256" ]; then
              echo "$OPENCODE_INSTALL_SHA256  $INSTALLER" | sha256sum -c -
            fi
            VERSION="$OPENCODE_VERSION" bash "$INSTALLER"
            rm -f "$INSTALLER"
            "$BIN" --version | grep -qx "$OPENCODE_VERSION"
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      # --- Review ----------------------------------------------------------
      - name: Run ${{ matrix.pass }} pass
        if: env.RUN_THIS_PASS == 'true'
        env:
          # --- Provider (per pass; see matrix above) -------------------------
          AI_API_KEY: ${{ matrix.pass == 'ponytail' && secrets.AI_PONYTAIL_API_KEY || secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ matrix.base_url }}
          AI_MODEL: ${{ matrix.model }}
          AI_PONYTAIL: ${{ matrix.ponytail }}
          AI_PONYTAIL_REF: ${{ vars.AI_PONYTAIL_REF }}

          # --- Optional tuning (shared by both passes) -----------------------
          AI_MAX_DIFF_CHARS: ${{ vars.AI_MAX_DIFF_CHARS }}     # default 120000
          AI_TEMPERATURE: ${{ vars.AI_TEMPERATURE }}           # default 0.2
          AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS }}             # default 8000; raise for reasoning models
          AI_TIMEOUT: ${{ vars.AI_TIMEOUT }}                   # api: per-chunk read timeout, default 600
          AI_AGENT_TIMEOUT: ${{ vars.AI_AGENT_TIMEOUT }}       # opencode: whole run, default 1500
          AI_STREAM: ${{ vars.AI_STREAM }}                     # api: default true
          AI_JSON_MODE: ${{ vars.AI_JSON_MODE }}               # api: set false for reasoning models
          # Provider-specific request fields as a JSON object, e.g. to disable thinking:
          #   Poolside/vLLM: {"chat_template_kwargs": {"enable_thinking": false}}
          #   OpenRouter:    {"reasoning": {"effort": "low"}}
          AI_EXTRA_BODY: ${{ vars.AI_EXTRA_BODY }}
          AI_EXCLUDE_PATTERNS: ${{ vars.AI_EXCLUDE_PATTERNS }} # comma-separated globs
          AI_EXTRA_INSTRUCTIONS: ${{ vars.AI_EXTRA_INSTRUCTIONS }}
          AI_INSTRUCTIONS_FILE: ${{ vars.AI_INSTRUCTIONS_FILE }} # default .github/ai-review-instructions.md
          AI_MAX_THREAD_CHARS: ${{ vars.AI_MAX_THREAD_CHARS }}   # prior-thread digest budget, default 12000; 0 disables

          # --- GitHub context (automatic) ----------------------------------
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ai_review.py
