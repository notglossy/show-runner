services:
  showrunner:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: showrunner-server:latest
    container_name: showrunner
    restart: unless-stopped
    ports:
      - "${SHOWRUNNER_PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      DEVICE_SHARED_SECRET: ${DEVICE_SHARED_SECRET:?set DEVICE_SHARED_SECRET in .env}
      WEATHER_LAT: ${WEATHER_LAT:-34.0522}
      WEATHER_LON: ${WEATHER_LON:--118.2437}
      WEATHER_UNITS: ${WEATHER_UNITS:-imperial}
      KIOSK_TIMEZONE: ${KIOSK_TIMEZONE:-America/Los_Angeles}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-google/gemini-3.8-flash}
    volumes:
      - showrunner-data:/data

volumes:
  showrunner-data:
