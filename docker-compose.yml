services:
  showrunner:
    # Published by the release workflow for every version tag, for linux/amd64 and linux/arm64.
    # SHOWRUNNER_VERSION (.env): a tag such as v0.3.0, "latest" (newest full release) or "beta"
    # (newest pre-release). To build from source: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
    image: ghcr.io/notglossy/show-runner:${SHOWRUNNER_VERSION:-latest}
    container_name: showrunner
    restart: unless-stopped
    ports:
      - "${SHOWRUNNER_PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # Optional since app 0.3: unset, displays register while "Add a display" is open in the dashboard.
      DEVICE_SHARED_SECRET: ${DEVICE_SHARED_SECRET:-}
      WEATHER_LAT: ${WEATHER_LAT:-34.0522}
      WEATHER_LON: ${WEATHER_LON:--118.2437}
      WEATHER_UNITS: ${WEATHER_UNITS:-imperial}
      KIOSK_TIMEZONE: ${KIOSK_TIMEZONE:-America/Los_Angeles}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-google/gemini-3.8-flash}
    volumes:
      - showrunner-data:/data

volumes:
  showrunner-data:
